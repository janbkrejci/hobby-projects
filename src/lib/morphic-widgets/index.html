<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Morphic Calculator</title>
    <script type="text/javascript" src="/morphic-widgets/morphic.js"></script>
    <script type="text/javascript" src="calculator.js"></script>
    <script type="text/javascript" src="fxrates.js"></script>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        background-color: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #141414;
        }
      }
    </style>
    <script type="text/javascript">
      var world;

      function applyTheme() {
        var isDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var background = isDark
          ? new Color(20, 20, 20)
          : new Color(255, 255, 255);
        if (world) {
          world.setColor(background);
        }
      }

      window.onload = function () {
        world = new WorldMorph(document.getElementById("world"));
        // window.world = world;
        // Set dev mode based on URL hash
        world.isDevMode = window.location.hash === "#devel";

        applyTheme();

        if (window.matchMedia) {
          var media = window.matchMedia("(prefers-color-scheme: dark)");
          media.addEventListener("change", applyTheme);
        }

        // Override context menu only if NOT in developer mode
        if (!world.isDevMode) {
          WorldMorph.prototype.contextMenu = function () {
            var menu = new MenuMorph(this, "TheSystem");
            menu.addItem("Kalkulačka", () => {
              var calc = new CalculatorMorph();
              calc.pickUp(this);
            });
            menu.addItem("Kurzy", () => {
              var rates = new FXRatesMorph();
              rates.pickUp(this);
            });
            menu.popUpAtHand(this);
          };
        } else {
          var calcTemplate = new CalculatorMorph();
          Morph.prototype.addToDemoMenu.call(calcTemplate, calcTemplate);

          var ratesTemplate = new FXRatesMorph();
          Morph.prototype.addToDemoMenu.call(ratesTemplate, ratesTemplate);
        }

        loop();
      };

      function loop() {
        requestAnimationFrame(loop);
        world.doOneCycle();
      }
    </script>
  </head>

  <body>
    <canvas
      id="world"
      tabindex="1"
      width="800"
      height="600"
      style="position: absolute"
    ></canvas>
  </body>
</html>
